<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3472"/>
      <stop offset="1" stop-color="#3B0B2D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#FF9A5C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC48A"/>
      <stop offset="1" stop-color="#E95420"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="tile"><rect x="32" y="28" width="448" height="448" rx="104"/></clipPath>
    <path id="spark" d="M0,-1 C0.10,-0.28 0.28,-0.10 1,0 C0.28,0.10 0.10,0.28 0,1 C-0.10,0.28 -0.28,0.10 -1,0 C-0.28,-0.10 -0.10,-0.28 0,-1 Z"/>
    <path id="brackets" d="M138,208 V162 a24,24 0 0 1 24,-24 H208
                           M304,138 H350 a24,24 0 0 1 24,24 V208
                           M374,304 V350 a24,24 0 0 1 -24,24 H304
                           M208,374 H162 a24,24 0 0 1 -24,-24 V304"/>
  </defs>

  <!-- soft ground shadow -->
  <rect x="36" y="42" width="440" height="448" rx="104" fill="#000" opacity="0.10"/>
  <rect x="40" y="48" width="432" height="440" rx="102" fill="#000" opacity="0.12"/>

  <!-- tile -->
  <rect x="32" y="28" width="448" height="448" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="32" y="28" width="448" height="448" fill="url(#glow)"/>
    <ellipse cx="256" cy="-40" rx="330" ry="250" fill="url(#gloss)"/>
  </g>
  <rect x="33.5" y="29.5" width="445" height="445" rx="102.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- viewfinder brackets: shadow then white -->
  <use href="#brackets" fill="none" stroke="#1d0517" stroke-opacity="0.38" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,9)"/>
  <use href="#brackets" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the glint -->
  <use href="#spark" fill="#1d0517" fill-opacity="0.35" transform="translate(256,268) scale(86)"/>
  <use href="#spark" fill="url(#star)" transform="translate(256,252) scale(86)"/>
  <use href="#spark" fill="#fff" fill-opacity="0.9" transform="translate(256,252) scale(26)"/>
  <use href="#spark" fill="#FFD7B0" transform="translate(326,188) scale(20)"/>
</svg>
